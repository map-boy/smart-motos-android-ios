name: Native Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Write Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > google-services.json

      - name: Write env file
        run: echo "${{ secrets.ENV_FILE_B64 }}" | base64 -d > .env

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smartmotos-debug-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: smartmotos-debug-*.apk
          tag_name: android-debug-${{ github.run_number }}
          name: Android Debug Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}